name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Test, lint, and build release
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintRelease assembleRelease
      - name: Package release APK
        id: release
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess, hashlib
          apk = pathlib.Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          version = re.search(r"versionName='([^']+)'", badging).group(1)
          version_code = re.search(r"versionCode='([^']+)'", badging).group(1)
          print('APK version:', version, 'version code:', version_code)
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          name = 'BYD-Weather-' + version + '-release-unsigned'
          packaged = dist / (name + '.apk')
          shutil.copyfile(apk, packaged)
          checksum = hashlib.sha256(packaged.read_bytes()).hexdigest()
          (dist / 'SHA256SUMS').write_text(checksum + '  ' + packaged.name + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('name=' + name + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.name }}
          path: dist/
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.html
            app/build/test-results/testDebugUnitTest/
