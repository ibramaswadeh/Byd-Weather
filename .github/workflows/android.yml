name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Test, lint, and build release
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintRelease assembleRelease
      - name: Package release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/BYD-Weather-1.1.1-release-unsigned.apk
          cd dist
          sha256sum BYD-Weather-1.1.1-release-unsigned.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BYD-Weather-1.1.1-release-unsigned
          path: dist/
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.html
            app/build/test-results/testDebugUnitTest/
